name: Generate Snake Animation

on:
  # Se ejecuta cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:

  # También se ejecuta en cada push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lucatsi
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#4ADE80&color_dots=#1a1f2e,#4ADE80,#22C55E,#16A34A,#15803D

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}